                                <Icons.ChevronRight />
                            </button>
                        </div>
                    </div>
                </div>
            );
        }

        function ContactPage() {
            const [contactForm, setContactForm] = useState({
                name: '',
                phone: '',
                message: ''
            });

            const handleContactSubmit = (e) => {
                e.preventDefault();
                const msg = `Hello Azure Hotel & Suites,\n\nName: ${contactForm.name}\nPhone: ${contactForm.phone}\n\nMessage:\n${contactForm.message}`;
                const url = `https://wa.me/${HOTEL_DATA.whatsapp}?text=${encodeURIComponent(msg)}`;
                window.open(url, '_blank');
            };

            return (
                <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-12 space-y-12">
                    <div className="text-center max-w-2xl mx-auto space-y-3">
                        <span className="text-xs font-semibold uppercase tracking-widest text-azure-700 dark:text-azure-400">Reach Us Directly</span>
                        <h1 className="font-serif text-4xl sm:text-5xl font-bold text-stone-900 dark:text-stone-100">Contact & Location</h1>
                        <p className="text-stone-600 dark:text-stone-400 text-sm">
                            Have questions or need assistance with your reservation? Contact Azure Hotel & Suites directly.
                        </p>
                    </div>

                    <div className="grid grid-cols-1 lg:grid-cols-2 gap-12">
                        {/* Direct Details */}

                            <div>
                                <h3 className="font-serif text-2xl font-bold text-stone-900 dark:text-stone-100 mb-4">Hotel Details</h3>
                                <div className="space-y-4 text-sm text-stone-600 dark:text-stone-300">
                                    <div className="flex items-start space-x-3">
                                        <Icons.MapPin />
                                        <span>{HOTEL_DATA.address}</span>
                                    </div>
                                    <div className="flex items-center space-x-3">
                                        <Icons.Phone />
                                        <span>Phone: <a href={`tel:${HOTEL_DATA.phoneRaw}`} className="underline font-semibold hover:text-azure-600">{HOTEL_DATA.phone}</a></span>
                                    </div>
                                    <div className="flex items-center space-x-3">
                                        <Icons.WhatsApp />
                                        <span>WhatsApp: {HOTEL_DATA.phone}</span>
                                    </div>
                                    <div className="flex items-center space-x-3">
                                        <Icons.Instagram />
                                        <span>Instagram: <a href={HOTEL_DATA.instagramUrl} target="_blank" rel="noopener noreferrer" className="underline font-semibold hover:text-pink-500">{HOTEL_DATA.instagram}</a></span>
                                    </div>
                                </div>
                            </div>

                            <div className="pt-6 border-t border-stone-100 dark:border-stone-800 space-y-3">
                                <h4 className="font-bold text-stone-900 dark:text-stone-100 text-sm">Instant WhatsApp Enquiry</h4>
                                <p className="text-xs text-stone-500">
                                    Tap below to open a direct chat on WhatsApp with our front desk team.
                                </p>
                                <a
                                    href={HOTEL_DATA.whatsappUrl}
                                    target="_blank"
                                    rel="noopener noreferrer"
                                    className="inline-flex items-center justify-center space-x-2 w-full py-3.5 rounded-xl bg-emerald-600 text-white font-medium text-sm shadow hover:bg-emerald-500 transition-colors"
                                >
                                    <Icons.WhatsApp />
                                    <span>Chat Directly on WhatsApp</span>
                                </a>
                            </div>
                        </div>

                        {/* Direct Message Form */}
                        <div className="bg-white dark:bg-stone-900 p-8 rounded-3xl border border-stone-200 dark:border-stone-800 shadow-sm">
                            <h3 className="font-serif text-2xl font-bold text-stone-900 dark:text-stone-100 mb-2">Send a Message</h3>
                            <p className="text-xs text-stone-500 mb-6">
                                Fill in your details below. Clicking send will open WhatsApp with your exact message prepared.
                            </p>
                            
                            <form onSubmit={handleContactSubmit} className="space-y-4">
                                <div>
                                    <label className="block text-xs font-semibold uppercase text-stone-500 mb-1">Full Name</label>
                                    <input 
                                        type="text" 
                                        required 
                                        value={contactForm.name}
                                        onChange={(e) => setContactForm({...contactForm, name: e.target.value})}
                                        placeholder="e.g. John Doe"
                                        className="w-full px-4 py-2.5 rounded-xl bg-stone-100 dark:bg-stone-800 border border-stone-300 dark:border-stone-700 text-sm focus:outline-none focus:ring-2 focus:ring-azure-500" 
                                    />
                                </div>
                                <div>
                                    <label className="block text-xs font-semibold uppercase text-stone-500 mb-1">Phone Number</label>
                                    <input 
                                        type="tel" 
                                        required 
                                        value={contactForm.phone}
                                        onChange={(e) => setContactForm({...contactForm, phone: e.target.value})}
                                        placeholder="e.g. 08012345678"
                                        className="w-full px-4 py-2.5 rounded-xl bg-stone-100 dark:bg-stone-800 border border-stone-300 dark:border-stone-700 text-sm focus:outline-none focus:ring-2 focus:ring-azure-500" 
                                    />
                                </div>
                                <div>
                                    <label className="block text-xs font-semibold uppercase text-stone-500 mb-1">Message / Enquiry</label>
                                    <textarea 
                                        rows="4" 
                                        required 
                                        value={contactForm.message}
                                        onChange={(e) => setContactForm({...contactForm, message: e.target.value})}
                                        placeholder="I would like to inquire about room rates for next weekend..."
                                        className="w-full px-4 py-2.5 rounded-xl bg-stone-100 dark:bg-stone-800 border border-stone-300 dark:border-stone-700 text-sm focus:outline-none focus:ring-2 focus:ring-azure-500"
                                    ></textarea>
                                </div>
                                <button type="submit" className="w-full py-3.5 rounded-xl bg-emerald-600 hover:bg-emerald-500 text-white font-medium text-sm flex items-center justify-center space-x-2 transition-all">
                                    <Icons.WhatsApp />
                                    <span>Send Message via WhatsApp</span>
                                </button>
                            </form>
                        </div>
                    </div>
                </div>
            );
        }

        function FloatingActions() {
            return (
                <div className="fixed bottom-6 right-6 z-50 flex flex-col sm:flex-row items-end sm:items-center space-y-2 sm:space-y-0 sm:space-x-3">
                    <a
                        href={HOTEL_DATA.instagramUrl}
                        target="_blank"
                        rel="noopener noreferrer"
                        className="group flex items-center space-x-2 bg-gradient-to-r from-purple-600 to-pink-600 hover:opacity-90 text-white px-4 py-3 rounded-full shadow-2xl transition-all transform hover:scale-105"
                        title="View Instagram"
                    >
                        <Icons.Instagram />
                        <span className="text-xs font-bold tracking-wide">
                            Wanna explore?
                        </span>
                    </a>

                    <a
                        href={HOTEL_DATA.whatsappUrl}
                        target="_blank"
                        rel="noopener noreferrer"
                        className="group flex items-center space-x-2 bg-emerald-600 hover:bg-emerald-500 text-white px-4 py-3 rounded-full shadow-2xl transition-all transform hover:scale-105"
                        title="Chat on WhatsApp"
                    >
                        <Icons.WhatsApp />
                        <span className="text-xs font-bold tracking-wide">
                            Chat Front Desk
                        </span>
                    </a>
                </div>
            );
        }

        function BookingModal({ isOpen, onClose, booking, setBooking, handleModalSubmit }) {
            return (
                <div className="fixed inset-0 z-50 bg-black/70 backdrop-blur-sm flex items-center justify-center p-4">
                    <div className="bg-white dark:bg-stone-900 max-w-lg w-full rounded-3xl p-6 sm:p-8 space-y-6 relative shadow-2xl border border-stone-200 dark:border-stone-800">
                        <button onClick={onClose} className="absolute top-5 right-5 text-stone-400 hover:text-stone-600">
                            <Icons.Close />
                        </button>

                        <div>
                            <span className="text-xs font-semibold uppercase text-azure-700 dark:text-azure-400">Reservation Inquiry</span>
                            <h3 className="font-serif text-2xl font-bold text-stone-900 dark:text-stone-100 mt-1">Check Room Availability</h3>
                            <p className="text-xs text-stone-500 mt-1">
                                Selecting your dates will construct an instant reservation enquiry directly sent to our WhatsApp desk.
                            </p>
                        </div>

                        <form onSubmit={handleModalSubmit} className="space-y-4">
                            <div>
                                <label className="block text-xs font-semibold text-stone-500 mb-1">Check-In Date</label>
                                <input 
                                    type="date" 
                                    value={booking.checkIn} 
                                    onChange={(e) => setBooking({...booking, checkIn: e.target.value})}
                                    className="w-full px-3 py-2.5 rounded-xl bg-stone-100 dark:bg-stone-800 border border-stone-300 dark:border-stone-700 text-sm focus:outline-none focus:ring-2 focus:ring-azure-500" 
                                />
                            </div>
                            <div>
                                <label className="block text-xs font-semibold text-stone-500 mb-1">Check-Out Date</label>
                                <input 
                                    type="date" 
                                    value={booking.checkOut} 
                                    onChange={(e) => setBooking({...booking, checkOut: e.target.value})}
                                    className="w-full px-3 py-2.5 rounded-xl bg-stone-100 dark:bg-stone-800 border border-stone-300 dark:border-stone-700 text-sm focus:outline-none focus:ring-2 focus:ring-azure-500" 
                                />
                            </div>
                            <div className="grid grid-cols-2 gap-3">
                                <div>
                                    <label className="block text-xs font-semibold text-stone-500 mb-1">Guests</label>
                                    <select 
                                        value={booking.guests} 
                                        onChange={(e) => setBooking({...booking, guests: e.target.value})}
                                        className="w-full px-3 py-2.5 rounded-xl bg-stone-100 dark:bg-stone-800 border border-stone-300 dark:border-stone-700 text-sm focus:outline-none focus:ring-2 focus:ring-azure-500"
                                    >
                                        <option>1 Adult</option>
                                        <option>2 Adults</option>
                                        <option>Family Stay</option>
                                    </select>
                                </div>
                                <div>
                                    <label className="block text-xs font-semibold text-stone-500 mb-1">Room Preference</label>
                                    <select 
                                        value={booking.roomType} 
                                        onChange={(e) => setBooking({...booking, roomType: e.target.value})}
                                        className="w-full px-3 py-2.5 rounded-xl bg-stone-100 dark:bg-stone-800 border border-stone-300 dark:border-stone-700 text-sm focus:outline-none focus:ring-2 focus:ring-azure-500"
                                    >
                                        <option>Executive Room</option>
                                        <option>Deluxe Suite</option>
                                        <option>Presidential Room</option>
                                    </select>
                                </div>
                            </div>
                            
                            <button type="submit" className="w-full py-3.5 rounded-xl bg-emerald-600 hover:bg-emerald-500 text-white font-medium text-sm flex items-center justify-center space-x-2 transition-all shadow-md">
                                <Icons.WhatsApp />
                                <span>Send Enquiry on WhatsApp</span>
                            </button>
                        </form>
                    </div>
                </div>
            );
        }

        function Footer({ navigateTo }) {
            return (
                <footer className="bg-stone-900 text-stone-300 pt-16 pb-12 border-t border-stone-800 text-xs">
                    <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 grid grid-cols-1 md:grid-cols-4 gap-8">
                        <div className="space-y-3">
                            <div className="flex items-center space-x-3">
                                <Icons.Logo />
                                <h3 className="font-serif text-2xl font-bold text-white">Azure Hotel & Suites</h3>
                            </div>
                            <p className="text-stone-400 leading-relaxed">{HOTEL_DATA.positioning}</p>
                        </div>
                        <div>
                            <h4 className="font-bold text-white text-sm mb-3">Quick Navigation</h4>
                            <ul className="space-y-2">
                                <li><button onClick={() => navigateTo('home')} className="hover:text-amber-400">Home</button></li>
                                <li><button onClick={() => navigateTo('rooms')} className="hover:text-amber-400">Rooms</button></li>
                                <li><button onClick={() => navigateTo('gallery')} className="hover:text-amber-400">Gallery</button></li>
                                <li><button onClick={() => navigateTo('reviews')} className="hover:text-amber-400">Guest Reviews</button></li>
                                <li><button onClick={() => navigateTo('about')} className="hover:text-amber-400">About</button></li>
                                <li><button onClick={() => navigateTo('contact')} className="hover:text-amber-400">Contact</button></li>
                            </ul>
                        </div>
                        <div>
                            <h4 className="font-bold text-white text-sm mb-3">Contact Information</h4>
                            <p className="text-stone-400 mb-2">{HOTEL_DATA.address}</p>
                            <p className="text-stone-300 font-semibold mb-1">Phone: {HOTEL_DATA.phone}</p>
                            <p className="text-stone-300 font-semibold">Instagram: {HOTEL_DATA.instagram}</p>
                        </div>
                        <div>
                            <h4 className="font-bold text-white text-sm mb-3">Guest Experience</h4>
                            <p className="text-stone-400 mb-4">4.3 ★ Google Rated from 112 verified guest reviews in New Oko-Oba, Agege, Lagos.</p>
                            <a 
                                href={HOTEL_DATA.whatsappUrl} 
                                target="_blank" 
                                rel="noopener noreferrer"
                                className="inline-flex items-center space-x-2 px-4 py-2 rounded-lg bg-emerald-600 hover:bg-emerald-500 text-white font-medium"
                            >
                                <Icons.WhatsApp />
                                <span>WhatsApp Front Desk</span>
                            </a>
                        </div>
                    </div>
                    <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 mt-12 pt-6 border-t border-stone-800 text-center text-stone-500">
                        <p>© {new Date().getFullYear()} Azure Hotel & Suites. All rights reserved.</p>
                    </div>
                </footer>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
